name: Generate ServiceNow Knowledge Base Article Sitemap

on:
  workflow_dispatch:
  workflow_call:

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Generate ServiceNow API Access Token
        id: auth
        run: |
          response=$(curl --location '${{ vars.SERVICE_NOW_BASE_URL }}/oauth_token.do' \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'grant_type=password' \
              --data-urlencode 'client_id=${{ secrets.SERVICE_NOW_CLIENT_ID }}' \
              --data-urlencode 'client_secret=${{ secrets.SERVICE_NOW_CLIENT_SECRET }}' \
              --data-urlencode 'username=${{ secrets.SERVICE_NOW_USERNAME }}' \
              --data-urlencode 'password=${{ secrets.SERVICE_NOW_PASSWORD }}')
          access_token=$(echo "$response" | jq -r '.access_token')
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Get ServiceNow Knowledge Base Articles
        id: articles
        run: |
          limit=100
          offset=0
          all_numbers='[]'
          total=-1
          while [ "$total" -eq -1 ] || [ "$(echo "$all_numbers" | jq 'length')" -lt "$total" ]; do
            response=$(curl --silent --dump-header headers.txt \
              '${{ vars.SERVICE_NOW_BASE_URL }}/api/now/table/kb_knowledge?sysparm_query=${{ vars.SYSPARM_QUERY }}&sysparm_fields=${{ vars.SYSPARM_FIELDS }}&sysparm_limit='"$limit"'&sysparm_offset='"$offset" \
              --header 'Authorization: Bearer ${{ steps.auth.outputs.access_token }}')
            total=$(grep -i 'x-total-count:' headers.txt | tr -d '\r' | awk '{print $2}')
            page_numbers=$(echo "$response" | jq -c '[.result[].number]')
            page_count=$(echo "$page_numbers" | jq 'length')
            all_numbers=$(echo "$all_numbers $page_numbers" | jq -sc 'add')
            echo "Fetched offset=$offset count=$page_count accumulated=$(echo "$all_numbers" | jq 'length') total=$total"
            offset=$((offset + limit))
          done
          echo "kb_numbers=$all_numbers" >> "$GITHUB_OUTPUT"

      - name: Generate Sitemap
        env:
          BASE_URL: ${{ vars.SERVICE_NOW_BASE_URL }}
        run: |
          mkdir -p sitemaps/servicenow-kba
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.sitemaps.org/schemas/sitemap/0.9 http://www.sitemaps.org/schemas/sitemap/0.9/sitemap.xsd">'
            echo '${{ steps.articles.outputs.kb_numbers }}' | jq -r '.[]' | while read kb_number; do
              echo "  <url><loc>${BASE_URL}/kb_view.do?sysparm_article=${kb_number}</loc></url>"
            done
            echo '</urlset>'
          } > sitemaps/servicenow-kba/sitemap.xml
          cat sitemaps/servicenow-kba/sitemap.xml

      - name: Upload sitemap artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-servicenow-kba
          path: sitemaps/servicenow-kba/
