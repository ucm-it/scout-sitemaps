name: Generate Sitemaps

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.chunk.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - id: chunk
        run: |
          all=$(yq -o=json -I=0 '.' .github/sites.yaml)
          total=$(echo "$all" | jq '. | length')
          chunks='[]'
          i=0
          while [ $i -lt $total ]; do
            end=$((i + 250))
            chunk=$(echo "$all" | jq -c "{site: .[${i}:${end}]}" | jq -Rs .)
            chunks=$(echo "$chunks" | jq -c ". + [$chunk]")
            i=$end
          done
          echo "chunks=$chunks" >> $GITHUB_OUTPUT

  generate-sitemap:
    needs: setup
    strategy:
      matrix:
        chunk: ${{ fromJSON(needs.setup.outputs.chunks) }}
      fail-fast: false
    uses: ./.github/workflows/generate-sitemap-batch.yaml
    with:
      matrix: ${{ matrix.chunk }}

  generate-servicenow-kba-sitemap:
    uses: ./.github/workflows/generate-servicenow-kba-sitemap.yaml
    secrets: inherit

  commit-sitemaps:
    runs-on: ubuntu-latest
    needs: [generate-sitemap, generate-servicenow-kba-sitemap]
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all sitemap artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded/
          pattern: sitemap-*

      - name: Move sitemaps into place
        run: |
          for dir in downloaded/sitemap-*/; do
            site=$(basename "$dir" | sed 's/sitemap-//')
            if [ -f "$dir/skip" ]; then
              rm -rf public/sitemaps/$site
              echo "Deleted public/sitemaps/$site — site has existing sitemap"
            else
              mkdir -p public/sitemaps/$site
              cp "$dir"* public/sitemaps/$site/
            fi
          done

      - name: Remove .gz extensions from sitemap-index.xml locations
        run: find public/sitemaps -name "sitemap-index.xml" | xargs sed -i 's/\.xml\.gz/.xml/g'

      - name: Commit sitemaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemaps/
          git diff --staged --quiet || git commit -m "chore: update sitemaps [skip ci]"
          git push
