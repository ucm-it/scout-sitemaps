name: Generate Sitemaps

on:
  push:
    branches: [main]
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site:
          - name: jobs
            url: https://jobs.ucmerced.edu
            concurrency: 1
            max_depth: 10
            enable_javascript: true
          - name: mercedid
            url: https://mercedid.ucmerced.edu
            concurrency: 1
            max_depth: 10
            enable_javascript: true
          - name: arts
            url: https://arts.ucmerced.edu
            concurrency: 1
            max_depth: 10
            enable_javascript: false
          - name: advising
            url: https://advising.ucmerced.edu
            concurrency: 1
            max_depth: 10
            enable_javascript: false
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Clone sitemap generator
        run: git clone --branch v3.0.0 --depth 1 https://github.com/iprodev/PHP-XML-Sitemap-Generator.git

      - name: Install dependencies
        run: composer install --no-dev -d PHP-XML-Sitemap-Generator

      - name: Install Chromium (if JavaScript enabled)
        if: matrix.site.enable_javascript == true
        run: sudo apt-get install -y chromium-browser

      - name: Restore sitemap DB cache for ${{ matrix.site.name }}
        uses: actions/cache@v5
        with:
          path: db/${{ matrix.site.name }}.db
          key: sitemap-db-${{ matrix.site.name }}
          restore-keys: sitemap-db-${{ matrix.site.name }}

      - name: Generate sitemap for ${{ matrix.site.name }}
        run: |
          mkdir -p db sitemaps/${{ matrix.site.name }}
          cd PHP-XML-Sitemap-Generator
          php bin/sitemap \
            --url=${{ matrix.site.url }} \
            --out=../sitemaps/${{ matrix.site.name }} \
            --concurrency=${{ matrix.site.concurrency }} \
            --max-depth=${{ matrix.site.max_depth }} \
            --db-enabled \
            --db-dsn=sqlite:../db/${{ matrix.site.name }}.db \
            --detect-changes \
            ${{ matrix.site.enable_javascript == true && '--enable-javascript --chrome-path=/usr/bin/chromium-browser' || '' }} \
            --verbose

      - name: Upload sitemap artifact
        uses: actions/upload-artifact@v4
        with:
          name: sitemap-${{ matrix.site.name }}
          path: sitemaps/${{ matrix.site.name }}/

  commit-sitemaps:
    runs-on: ubuntu-latest
    needs: generate-sitemap
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all sitemap artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded/
          pattern: sitemap-*

      - name: Move sitemaps into place
        run: |
          for dir in downloaded/sitemap-*/; do
            site=$(basename "$dir" | sed 's/sitemap-//')
            mkdir -p public/sitemaps/$site
            cp "$dir"*.xml public/sitemaps/$site/
          done

      - name: Commit sitemaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemaps/
          git diff --staged --quiet || git commit -m "chore: update sitemaps [skip ci]"
          git push
