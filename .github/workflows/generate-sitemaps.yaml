name: Generate Sitemaps

on:
  push:
    branches: [main]
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix1: ${{ steps.set-matrix.outputs.matrix1 }}
      matrix2: ${{ steps.set-matrix.outputs.matrix2 }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          echo "matrix1=$(yq -o=json -I=0 '{"site": .}' .github/sites-1.yaml)" >> $GITHUB_OUTPUT
          echo "matrix2=$(yq -o=json -I=0 '{"site": .}' .github/sites-2.yaml)" >> $GITHUB_OUTPUT

  generate-sitemap-1:
    needs: setup
    uses: ./.github/workflows/generate-sitemap-batch.yaml
    with:
      matrix: ${{ needs.setup.outputs.matrix1 }}

  generate-sitemap-2:
    needs: setup
    uses: ./.github/workflows/generate-sitemap-batch.yaml
    with:
      matrix: ${{ needs.setup.outputs.matrix2 }}

  commit-sitemaps:
    runs-on: ubuntu-latest
    needs: [generate-sitemap-1, generate-sitemap-2]
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all sitemap artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded/
          pattern: sitemap-*

      - name: Move sitemaps into place
        run: |
          for dir in downloaded/sitemap-*/; do
            site=$(basename "$dir" | sed 's/sitemap-//')
            if [ -f "$dir/skip" ]; then
              rm -rf public/sitemaps/$site
              echo "Deleted public/sitemaps/$site — site has existing sitemap"
            else
              mkdir -p public/sitemaps/$site
              cp "$dir"* public/sitemaps/$site/
            fi
          done

      - name: Remove .gz extensions from sitemap-index.xml locations
        run: find public/sitemaps -name "sitemap-index.xml" | xargs sed -i 's/\.xml\.gz/.xml/g'

      - name: Commit sitemaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemaps/
          git diff --staged --quiet || git commit -m "chore: update sitemaps [skip ci]"
          git push
