name: Generate Sitemaps

on:
  push:
    branches: [main]
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Clone sitemap generator
        run: git clone --branch v3.0.0 --depth 1 https://github.com/iprodev/PHP-XML-Sitemap-Generator.git

      - name: Install dependencies
        run: composer install --no-dev -d PHP-XML-Sitemap-Generator

      - name: Install Chromium
        run: sudo apt-get install -y chromium-browser

      - name: Restore sitemap DB cache
        uses: actions/cache@v5
        with:
          path: db/
          key: sitemap-db-${{ github.run_id }}
          restore-keys: sitemap-db-

      - name: Generate sitemaps
        run: |
          site_count=$(yq '. | length' .github/sites.yaml)
          for i in $(seq 0 $((site_count - 1))); do
            name=$(yq ".[${i}].name" .github/sites.yaml)
            url=$(yq ".[${i}].url" .github/sites.yaml)
            concurrency=$(yq ".[${i}].concurrency" .github/sites.yaml)
            max_depth=$(yq ".[${i}].max_depth" .github/sites.yaml)
            enable_javascript=$(yq ".[${i}].enable_javascript" .github/sites.yaml)

            js_flags=""
            if [ "$enable_javascript" = "true" ]; then
              js_flags="--enable-javascript --chrome-path=/usr/bin/chromium-browser"
            fi

            mkdir -p db sitemaps/${name}
            cd PHP-XML-Sitemap-Generator
            php bin/sitemap \
              --url=${url} \
              --out=../sitemaps/${name} \
              --concurrency=${concurrency} \
              --max-depth=${max_depth} \
              --db-enabled \
              --db-dsn=sqlite:../db/${name}.db \
              --detect-changes \
              ${js_flags} \
              --verbose || true
            cd ..
          done

      - name: Move sitemaps into place
        run: |
          for dir in sitemaps/*/; do
            site=$(basename "$dir")
            mkdir -p public/sitemaps/$site
            cp "$dir"* public/sitemaps/$site/
          done

      - name: Remove .gz extensions from sitemap-index.xml locations
        run: find public/sitemaps -name "sitemap-index.xml" | xargs sed -i 's/\.xml\.gz/.xml/g'

      - name: Commit sitemaps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemaps/
          git diff --staged --quiet || git commit -m "chore: update sitemaps [skip ci]"
          git push
